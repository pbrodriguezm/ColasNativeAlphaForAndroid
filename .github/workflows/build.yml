name: Build & Sign APK (Google TV)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle perms
        run: chmod +x gradlew

      # (Opcional) Parchear Manifest si te sigue saliendo "no compatible".
      # Descomenta este paso SOLO si aún no agregaste estas líneas en tu AndroidManifest.xml
      # <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
      # <uses-feature android:name="android.software.leanback" android:required="false" />
      # <uses-feature android:name="android.hardware.camera" android:required="false" />
      # <uses-feature android:name="android.hardware.telephony" android:required="false" />
      # - name: Patch Manifest for TV (optional)
      #   shell: bash
      #   run: |
      #     MANIFEST="app/src/main/AndroidManifest.xml"
      #     if ! grep -q 'android.hardware.touchscreen' "$MANIFEST"; then
      #       awk '1;/<manifest/{print "    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\"/>\n    <uses-feature android:name=\"android.software.leanback\" android:required=\"false\"/>\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"/>\n    <uses-feature android:name=\"android.hardware.telephony\" android:required=\"false\"/>"}' "$MANIFEST" > tmp.xml
      #       mv tmp.xml "$MANIFEST"
      #     fi

      # Compila SOLO el flavor/variant que ya te funcionó en tus logs
      - name: Build extendedGithubRelease
        run: ./gradlew :app:assembleExtendedGithubRelease

      # Generar keystore "ephemeral" (se crea en cada build)
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storepass 123456 \
            -keypass 123456 \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Colas, OU=PRL, O=PRL, L=Arequipa, ST=Arequipa, C=PE"

      # Firmar UNIVERSAL si existe; si no, firmar ARM64 (Google TV moderno)
      - name: Sign release (universal or arm64)
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          OUT="app/build/outputs/apk/extendedGithub/release"
          APK_UNI=$(ls "$OUT"/*-universal-release-*.apk 2>/dev/null || true)
          APK_ARM64=$(ls "$OUT"/*-arm64-v8a-release-*.apk 2>/dev/null || true)

          if [ -n "$APK_UNI" ]; then
            cp "$APK_UNI" "${APK_UNI%.apk}-signed.apk"
            "$BT/apksigner" sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias release "${APK_UNI%.apk}-signed.apk"
            "$BT/apksigner" verify "${APK_UNI%.apk}-signed.apk"
          fi

          if [ -n "$APK_ARM64" ]; then
            cp "$APK_ARM64" "${APK_ARM64%.apk}-signed.apk"
            "$BT/apksigner" sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias release "${APK_ARM64%.apk}-signed.apk"
            "$BT/apksigner" verify "${APK_ARM64%.apk}-signed.apk"
          fi

      - name: Upload SIGNED release APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: app/build/outputs/apk/extendedGithub/release/*-signed.apk

      # Extra: genera también DEBUG (firmado con debug key) por si quieres probar rápido
      - name: Build extendedGithubDebug
        run: ./gradlew :app:assembleExtendedGithubDebug

      - name: Upload DEBUG APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: debug-autosigned
          path: app/build/outputs/apk/extendedGithub/debug/*.apk
