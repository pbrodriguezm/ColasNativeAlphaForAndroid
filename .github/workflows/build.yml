# .github/workflows/build.yml
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew

      # (1) Build debug (firmado con debug key)
      - name: Build extendedGithubDebug
        run: ./gradlew :app:assembleExtendedGithubDebug

      - name: Upload DEBUG APK
        uses: actions/upload-artifact@v4
        with:
          name: app-extended-github-debug
          path: app/build/outputs/apk/extendedGithub/debug/*.apk
