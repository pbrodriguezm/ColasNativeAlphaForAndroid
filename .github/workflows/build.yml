# .github/workflows/build.yml
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compila SOLO el variant que pasó en tu log
      - name: Build extendedGithubRelease
        run: ./gradlew :app:assembleExtendedGithubRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-extended-github-release
          path: app/build/outputs/apk/extendedGithub/release/*.apk
